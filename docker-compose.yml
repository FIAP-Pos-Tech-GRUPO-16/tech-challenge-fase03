services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital_scheduling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduling-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduling-service
    environment:
      DB_HOST: postgres
      DB_NAME: hospital_scheduling
      DB_USERNAME: hospital
      DB_PASSWORD: hospital
      RABBITMQ_HOST: rabbitmq
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-troque-este-segredo-em-producao-32-bytes+}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification-service
    environment:
      DB_HOST: postgres
      DB_NAME: hospital_notification
      DB_USERNAME: hospital
      DB_PASSWORD: hospital
      RABBITMQ_HOST: rabbitmq
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-troque-este-segredo-em-producao-32-bytes+}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  history-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: history-service
    environment:
      DB_HOST: postgres
      DB_NAME: hospital_history
      DB_USERNAME: hospital
      DB_PASSWORD: hospital
      RABBITMQ_HOST: rabbitmq
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-troque-este-segredo-em-producao-32-bytes+}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
