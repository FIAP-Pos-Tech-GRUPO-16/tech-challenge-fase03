server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: scheduling-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_scheduling}
    username: ${DB_USERNAME:hospital}
    password: ${DB_PASSWORD:hospital}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:troque-este-segredo-em-producao-32-bytes+}
    expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    br.com.postech.hospital: INFO
